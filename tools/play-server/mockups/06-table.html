<!doctype html><html><head><meta charset="utf-8"><title>6 · Table</title>
<link rel="stylesheet" href="common.css">
<style>
  /* 6 · TABLE — the owner's layout (2026-10-12). You sit in the middle: three rows
     (creatures / other / lands-smaller) and the hand under them. Opponents' compact
     boards stack in the side columns; clicking one focuses them across the table at
     the top (mirrored, lands nearest the far edge); a turn change focuses the new
     active player. Right-click a seat for graveyard / exile. Every card magnifies
     on hover and feeds the popped-out card window. The dock on the right holds the
     phase dial, the stack and the prompt. All sizes are fr / em / one --card
     variable; nothing is a fixed pixel band. Designed at 2560×1340, checked at
     1707×880. */
  .app { display: grid; height: 100vh; gap: 6px; padding: 6px;
         grid-template-columns: minmax(230px, 13%) minmax(0, 1fr) minmax(230px, 13%) 22rem;
         grid-template-rows: 2.2rem minmax(0, 1fr);
         grid-template-areas: 'top top top top' 'left centre right dock'; }
  .top { grid-area: top; display: flex; align-items: center; gap: 12px; padding: 0 8px; border-bottom: 1px solid var(--line); font-size: 0.8rem; }
  .top .mock { display: flex; align-items: center; gap: 6px; margin-left: 1rem; padding: 2px 8px; border: 1px dashed #445; border-radius: 4px; color: #889; font-size: 0.7rem; }
  .top .mock select, .top .mock input { font: inherit; background: #0f0f22; color: #ccd; border: 1px solid #33335a; border-radius: 3px; }
  .top .spacer { margin-left: auto; }
  .top .btn { padding: 2px 10px; font-size: 0.75rem; }

  /* side columns */
  .side { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; }
  .side.left { grid-area: left; } .side.right { grid-area: right; }
  .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; gap: 5px; min-height: 0; min-width: 0; cursor: pointer; flex: 1 1 0; overflow: hidden; }
  .cell:hover { border-color: #55558a; }
  .cell.active { border-color: var(--active); box-shadow: inset 0 0 0 1px var(--active); }
  .cell .hdr { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .cell .cmd { color: var(--dim); font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .cards { gap: 4px; }
  .cell .lands { font-size: 0.72rem; }
  .cell .hint { margin-top: auto; font-size: 0.6rem; color: #556; }

  /* centre */
  .centre { grid-area: centre; display: grid; grid-template-rows: 38% minmax(0, 1fr) auto; gap: 6px; min-height: 0; min-width: 0; }
  .focused { background: #121226; border: 1px solid #33335a; border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: hidden; }
  .focused.active { border-color: var(--active); }
  .focused .hdr { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .focused .zone { display: flex; gap: 10px; }
  .focused .zone .row-label { flex: 0 0 5rem; padding-top: 4px; }
  .focused .zone.creatures { flex: 1 1 auto; align-items: flex-end; }
  .focused .zone.creatures .cards { align-content: flex-end; }
  .focused .zone.lands .cards { gap: 4px; }
  .board { background: #0f1a12; border: 1px solid #2a4a30; border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: hidden; }
  .board.active { border-color: var(--you); }
  .board .hdr { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #1e3a22; padding-bottom: 4px; }
  .board .zone { display: flex; gap: 10px; min-height: 0; }
  .board .zone .row-label { flex: 0 0 5rem; padding-top: 4px; color: #586; }
  .board .zone.creatures, .board .zone.others { flex: 0 1 auto; overflow: hidden; }
  .board .zone.lands { margin-top: auto; border-top: 1px solid #1e3a22; padding-top: 6px; }
  .board .zone.lands .cards { gap: 4px; flex: 1; }
  .piles { display: flex; gap: 6px; align-items: flex-start; }
  .pile { width: calc(var(--card) * 0.65); height: calc(var(--card) * 0.65 * 1.4); border: 1px dashed #3a5a40; border-radius: 4px; font-size: 0.58rem; color: #586; text-align: center; padding-top: 4px; cursor: pointer; }
  .pile:hover { border-color: #7a9a80; color: #9ab; }
  .hand { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: #0d0d1a; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; overflow-y: visible; }
  .hand .label { color: #88a; font-size: 0.64rem; letter-spacing: .06em; flex: 0 0 3rem; }

  /* dock */
  .dock { grid-area: dock; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; min-height: 0; }
  .dock > div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 0; }
  .dial-box { display: flex; align-items: center; gap: 10px; }
  .dial { position: relative; width: 13rem; height: 13rem; flex: 0 0 auto; }
  .dial svg { width: 100%; height: 100%; overflow: visible; }
  .dial .ring { transform-origin: 100px 100px; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .dial .tick { stroke: #556; stroke-width: 2; }
  .dial .lbl { font-size: 10.5px; fill: #889; font-family: inherit; letter-spacing: .04em; }
  .dial .lbl.now { fill: #fd9; font-weight: bold; }
  .dial .combat { fill: rgba(255,120,60,.12); }
  .dial .pointer { fill: #fd9; }
  .hub { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 0.72rem; line-height: 1.35; pointer-events: none; }
  .hub .turn { color: #adf; font-weight: bold; }
  .hub .who { color: #aab; }
  .hub .who.me { color: #6af; font-weight: bold; }
  .hub .prio { color: #889; font-size: 0.64rem; }
  .hub .prio.me { color: #fc8; font-weight: bold; }
  .dial-side { display: flex; flex-direction: column; gap: 4px; font-size: 0.74rem; color: #aab; }
  .dial-side .step { color: #fd9; font-weight: bold; font-size: 0.9rem; }
  .stack-box { overflow: auto; }
  .prompt-box .p-sentence { font-size: 0.9rem; }
  .prompt-box .p-buttons { flex-direction: column; }
  .prompt-box .btn.primary { font-size: 0.95rem; padding: 10px; }
  .prompt-box .waiting { color: #667; font-style: italic; padding: 10px 0; }
</style></head><body class="t6">
<div class="app">
  <div class="top">
    <b style="color:#adf">scutemob</b><span class="dim">seed 3 · 4 seats</span>
    <span class="mock">mockup state <select id="state"></select> · card size <input id="size" type="range" min="56" max="120"> <button class="btn" id="nextturn">next turn ↻</button></span>
    <span class="spacer"></span>
    <button class="btn" id="popout">card window ↗</button>
    <button class="btn">log</button>
    <button class="btn">≡ menu</button>
  </div>
  <div class="side left" id="left"></div>
  <div class="centre">
    <div class="focused" id="focused"></div>
    <div class="board" id="board"></div>
    <div class="hand" id="hand"></div>
  </div>
  <div class="side right" id="right"></div>
  <div class="dock">
    <div class="dial-box"><div class="dial" id="dial"></div><div class="dial-side" id="dialside"></div></div>
    <div class="stack-box"><div class="panel-title">Stack</div><div id="stack"></div></div>
    <div class="prompt-box" id="prompt"></div>
  </div>
</div>
<script src="common.js"></script>
<script>
  // ---- state --------------------------------------------------------------
  const params = new URLSearchParams(location.search);
  let stateId = Number(params.get('state')) || 1;
  let S = STATES[stateId]();
  let G = S.game;
  let focus = S.focus;
  let hover = null;

  const $ = (id) => document.getElementById(id);
  const sel = $('state');
  for (const k of Object.keys(STATES)) { const o = document.createElement('option'); o.value = k; o.textContent = `${k} · ${STATES[k]().label}`; sel.append(o); }
  sel.value = stateId;
  sel.onchange = () => { stateId = Number(sel.value); S = STATES[stateId](); G = S.game; focus = S.focus; render(); };

  // card-size slider, persisted (per-viewer convenience)
  const size = $('size');
  try { const v = localStorage.getItem('t6-card'); if (v) { document.body.style.setProperty('--card', v + 'px'); size.value = v; } else { size.value = Math.round(parseFloat(getComputedStyle(document.body).getPropertyValue('--card'))); } } catch { size.value = 84; }
  size.oninput = () => { document.body.style.setProperty('--card', size.value + 'px'); try { localStorage.setItem('t6-card', size.value); } catch {} };

  $('popout').onclick = () => window.open('card-window.html', 'scutemob-card', 'width=760,height=1060');

  // mockup-only: rotate the active player; focus follows the new active player
  $('nextturn').onclick = () => {
    const order = ['Human-1', ...G.opps.map((o) => o.name)];
    const next = order[(order.indexOf(G.active) + 1) % order.length];
    G.active = next; G.priority = next; G.step = 'Untap';
    G.opps.forEach((o) => { o.active = o.name === next; });
    if (next !== 'Human-1') focus = next;
    if (next === 'Human-1') { G.prompt = { sentence: 'Your untap step.', buttons: [{ t: 'Pass priority', key: 'space', primary: true }] }; G.you.hand.forEach((c) => { delete c.lit; }); }
    else { G.prompt = { sentence: `${next} is deciding…`, buttons: [], waiting: true }; G.you.hand.forEach((c) => { delete c.lit; }); }
    render();
  };

  // ---- renderers ----------------------------------------------------------
  function seatHdr(p, extra = '') {
    return `<span class="seat-name">${p.name}</span>${p.active ? ' <span class="badge active">active</span>' : ''}${p.name === G.priority ? ' <span class="badge prio">priority</span>' : ''}<span class="counts">hand ${Array.isArray(p.hand) ? p.hand.length : p.hand} · lib ${p.lib} · gy ${p.gy}</span>${extra}<span class="life${p.life < 20 ? ' low' : ''}">${p.life}</span>`;
  }

  function sideCell(o) {
    const d = el('div', 'cell' + (o.active ? ' active' : '') + (o.name === G.priority ? ' prio-ring' : ''));
    d.append(el('div', 'hdr', seatHdr(o)), el('div', 'cmd', `★ ${o.commander}`));
    d.append(cardsRow(o.creatures.concat(o.others), 'mini'));
    d.append(el('div', 'lands', `lands ${landPips(o.lands)}`), el('div', 'hint', 'click to bring across the table · right-click for graveyard'));
    d.onclick = () => { focus = o.name; render(); };
    d.oncontextmenu = (e) => ctxMenu(e, o);
    return d;
  }

  function focusedArea(o) {
    const f = $('focused'); f.innerHTML = '';
    f.className = 'focused' + (o.active ? ' active' : '');
    const hdr = el('div', 'hdr' + (o.name === G.priority ? ' prio-ring' : ''), `<span class="badge" style="background:#334;color:#9bd">across</span> ${seatHdr(o, `<span class="counts">★ ${o.commander}</span>`)}`);
    hdr.oncontextmenu = (e) => ctxMenu(e, o);
    f.append(hdr);
    const z1 = el('div', 'zone lands'); z1.append(el('div', 'row-label', `lands ${o.lands.total}`), landsAsCards(o.lands)); f.append(z1);
    const z2 = el('div', 'zone others'); z2.append(el('div', 'row-label', `other ${o.others.length}`), cardsRow(o.others, 'perm')); f.append(z2);
    const z3 = el('div', 'zone creatures'); z3.append(el('div', 'row-label', `creatures ${o.creatures.length}`), cardsRow(o.creatures, 'perm')); f.append(z3);
  }

  function landsAsCards(l) {
    // Opponent lands are counts in the view; draw them as a stack of small land cards.
    const list = [];
    if (l.total - l.tapped > 0) list.push({ n: 'Forest', count: l.total - l.tapped });
    if (l.tapped > 0) list.push({ n: 'Forest', count: l.tapped, tapped: true });
    return cardsRow(list, 'small');
  }

  function yourBoard() {
    const b = $('board'); b.innerHTML = '';
    b.className = 'board' + (G.active === 'Human-1' ? ' active' : '') + (G.priority === 'Human-1' ? ' prio-ring' : '');
    const hdr = el('div', 'hdr', `<span class="badge" style="background:#443;color:#fd6">you</span> ${seatHdr(G.you, `<span class="counts">★ ${G.you.commander}</span>`)}`);
    hdr.oncontextmenu = (e) => ctxMenu(e, G.you);
    b.append(hdr);
    const z1 = el('div', 'zone creatures'); z1.append(el('div', 'row-label', `creatures ${G.you.creatures.length}`), cardsRow(G.you.creatures, 'perm')); b.append(z1);
    const z2 = el('div', 'zone others'); z2.append(el('div', 'row-label', `other ${G.you.others.length}`), cardsRow(G.you.others, 'perm')); b.append(z2);
    const z3 = el('div', 'zone lands'); z3.append(el('div', 'row-label', `lands ${G.you.lands.reduce((a, c) => a + (c.count || 1), 0)}`), cardsRow(G.you.lands, 'small'));
    const piles = el('div', 'piles');
    const gy = el('div', 'pile', `GY<br><b>${G.you.gyCards.length}</b>`); gy.onclick = (e) => pilePopover(e, 'Your graveyard', G.you.gyCards);
    const ex = el('div', 'pile', `EXILE<br><b>${G.you.exileCards.length}</b>`); ex.onclick = (e) => pilePopover(e, 'Exile', G.you.exileCards);
    piles.append(gy, ex); z3.append(piles); b.append(z3);
    const h = $('hand'); h.innerHTML = ''; h.append(el('div', 'label', `HAND ${G.you.hand.length}`));
    G.you.hand.forEach((c) => h.append(cardEl(c, 'hand')));
  }

  function dial() {
    const i = GAME.steps.indexOf(G.step);
    const d = $('dial');
    const R = 100, r1 = 64, r2 = 94;
    const pt = (ang, r) => { const a = (ang - 90) * Math.PI / 180; return [R + r * Math.cos(a), R + r * Math.sin(a)]; };
    let ticks = '', labels = '';
    GAME.steps.forEach((s, k) => {
      const ang = k * 30;
      const [x1, y1] = pt(ang, r1), [x2, y2] = pt(ang, r2);
      ticks += `<line class="tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
      const [lx, ly] = pt(ang + 15, 79);
      labels += `<text class="lbl${k === i ? ' now' : ''}" x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${ang + 15} ${lx} ${ly})">${s.toUpperCase().replace('BEGIN COMBAT', 'BEGIN').replace('END COMBAT', 'END CBT')}</text>`;
    });
    // combat sector: steps 4..8 → angles 120..270
    const [ax, ay] = pt(120, r2 + 4), [bx, by] = pt(270, r2 + 4), [cx, cy] = pt(270, r1 - 4), [dx, dy] = pt(120, r1 - 4);
    const sector = `<path class="combat" d="M${ax} ${ay} A${r2 + 4} ${r2 + 4} 0 0 1 ${bx} ${by} L${cx} ${cy} A${r1 - 4} ${r1 - 4} 0 0 0 ${dx} ${dy} Z"/>`;
    d.innerHTML = `<svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="${r2}" fill="#0f0f22" stroke="#33335a"/>
      <circle cx="100" cy="100" r="${r1}" fill="#141428" stroke="#33335a"/>
      <g class="ring" style="transform: rotate(${-(i * 30 + 15)}deg)">${sector}${ticks}${labels}</g>
      <polygon class="pointer" points="100,2 94,-8 106,-8"/>
    </svg>
    <div class="hub"><div class="turn">Turn ${G.turn}</div><div class="who${G.active === 'Human-1' ? ' me' : ''}">${G.active === 'Human-1' ? 'your turn' : G.active}</div><div class="prio${G.priority === 'Human-1' ? ' me' : ''}">priority: ${G.priority === 'Human-1' ? 'YOU' : G.priority}</div></div>`;
    $('dialside').innerHTML = `<div class="dim" style="font-size:.64rem;letter-spacing:.06em">STEP</div><div class="step">${G.step}</div><div>${G.active === 'Human-1' ? 'your' : G.active + "'s"} turn</div><div class="dim">${i >= 4 && i <= 8 ? 'combat' : i < 4 ? 'beginning / main' : 'main 2 / ending'}</div>`;
  }

  function stackAndPrompt() {
    const s = $('stack'); s.innerHTML = '';
    if (G.stack.length === 0) s.append(el('div', 'dim', 'empty'));
    G.stack.forEach((x, k) => s.append(el('div', 'stack-item' + (k === G.stack.length - 1 ? ' top' : ''), `<div class="s-who">${x.who} cast</div><div class="s-name">${x.n}</div><div class="s-text">${x.text}</div>`)));
    const p = $('prompt'); p.innerHTML = '';
    p.append(el('div', 'panel-title', G.priority === 'Human-1' ? 'Your decision' : 'Waiting'));
    if (G.prompt.waiting) { p.append(el('div', 'waiting', G.prompt.sentence)); return; }
    const pr = el('div', 'prompt'); pr.append(el('div', 'p-sentence', G.prompt.sentence));
    const b = el('div', 'p-buttons'); G.prompt.buttons.forEach((x) => b.append(el('button', 'btn' + (x.primary ? ' primary' : '') + (x.lit ? ' lit' : ''), x.t + (x.key ? ` <kbd>${x.key}</kbd>` : '')))); pr.append(b); p.append(pr);
  }

  function render() {
    const others = G.opps.filter((o) => o.name !== focus);
    const L = $('left'), Rr = $('right'); L.innerHTML = ''; Rr.innerHTML = '';
    others.forEach((o, k) => (k % 2 === 0 ? L : Rr).append(sideCell(o)));
    focusedArea(G.opps.find((o) => o.name === focus));
    yourBoard(); dial(); stackAndPrompt();
  }

  // ---- context menu + popovers ---------------------------------------------
  function closeFloating() { document.querySelectorAll('.ctx, .popover').forEach((n) => n.remove()); }
  document.addEventListener('mousedown', (e) => { if (!e.target.closest('.ctx, .popover')) closeFloating(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFloating(); });

  function ctxMenu(e, p) {
    e.preventDefault(); closeFloating();
    const m = el('div', 'ctx'); m.style.left = e.clientX + 'px'; m.style.top = e.clientY + 'px';
    m.append(el('div', 'ctx-title', p.name));
    const gy = el('button', '', `View graveyard (${(p.gyCards || []).length})`); gy.onclick = () => pilePopover(e, `${p.name}'s graveyard`, p.gyCards || []); m.append(gy);
    const ex = el('button', '', `View exile (${(p.exileCards || []).length})`); ex.onclick = () => pilePopover(e, 'Exile', p.exileCards || []); m.append(ex);
    m.append(el('button', '', 'Commander damage'));
    if (p.name !== 'Human-1' && p.name !== focus) { const f = el('button', '', 'Bring across the table'); f.onclick = () => { focus = p.name; closeFloating(); render(); }; m.append(f); }
    document.body.append(m);
    const r = m.getBoundingClientRect(); if (r.right > innerWidth) m.style.left = (innerWidth - r.width - 8) + 'px'; if (r.bottom > innerHeight) m.style.top = (innerHeight - r.height - 8) + 'px';
  }

  function pilePopover(e, title, cards) {
    closeFloating();
    const p = el('div', 'popover');
    p.append(el('div', 'panel-title', `<span>${title} · ${cards.length}</span><span style="cursor:pointer" onclick="this.closest('.popover').remove()">✕</span>`));
    p.append(cards.length ? cardsRow(cards, 'perm') : el('div', 'dim', 'empty'));
    p.style.left = Math.min(e.clientX, innerWidth - 600) + 'px'; p.style.top = Math.min(e.clientY, innerHeight - 220) + 'px';
    document.body.append(p);
  }

  render();
</script></body></html>
