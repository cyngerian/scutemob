<!doctype html><html><head><meta charset="utf-8"><title>2 · Arena</title>
<link rel="stylesheet" href="common.css">
<style>
  /* 2 · ARENA — one playmat, no boxes. Opponent lanes across the top like a
     mirrored board; your creatures front and centre; lands and rocks in a low
     row; hand fanned over the bottom edge; one big action button bottom-right.
     Avatars with life at the left edge. Log lives behind a button. */
  body { background: radial-gradient(ellipse at 50% 40%, #142018 0%, #0a0a14 70%); }
  .app { display: grid; height: 100vh; grid-template-columns: 150px minmax(0,1fr) 230px;
         grid-template-rows: 30px minmax(0,1fr) 190px;
         grid-template-areas: 'top top top' 'seats mat right' 'seats hand right'; }
  .top { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 0 12px; color: #aab; }
  .seats { grid-area: seats; display: flex; flex-direction: column; gap: 10px; padding: 8px; }
  .seat { background: rgba(10,10,30,.8); border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .seat.you { border-color: var(--you); margin-top: auto; }
  .seat.active { border-color: var(--active); }
  .seat .life { margin: 0; font-size: 1.6rem; }
  .seat .counts { margin: 0; }
  .mat { grid-area: mat; display: grid; grid-template-rows: 28% minmax(0,1fr) auto; gap: 6px; padding: 4px 10px; min-height: 0; }
  .lanes { display: flex; flex-direction: column; gap: 4px; min-height: 0; }
  .lane { display: flex; align-items: center; gap: 8px; flex: 1; min-height: 0; border-bottom: 1px dashed #223; }
  .lane .who { flex: 0 0 120px; font-size: 0.75rem; }
  .lane .cards { flex-wrap: nowrap; overflow: hidden; }
  .lane .lands { margin-left: auto; font-size: 0.7rem; flex: 0 0 auto; }
  .mine { display: flex; flex-direction: column; justify-content: center; gap: 10px; min-height: 0; }
  .mine .cards { justify-content: center; --perm-w: 112px; }
  .low { display: flex; justify-content: center; align-items: flex-end; gap: 8px; }
  .low .cards { --small-w: 60px; }
  .low .sep { width: 1px; height: 60px; background: #334; margin: 0 10px; }
  .hand { grid-area: hand; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 10px; position: relative; }
  .hand .card { margin: 0 -14px; transform: translateY(20px) rotate(calc(var(--i) * 4deg - 8deg)); transform-origin: bottom center; box-shadow: 0 6px 18px rgba(0,0,0,.8); }
  .hand .card.lit { transform: translateY(0) rotate(calc(var(--i) * 4deg - 8deg)); }
  .right { grid-area: right; display: flex; flex-direction: column; gap: 8px; padding: 8px; }
  .stackbox { background: rgba(10,10,30,.85); border: 1px solid #553; border-radius: 8px; padding: 8px; }
  .prompt-float { margin-top: auto; background: rgba(10,10,30,.9); border: 1px solid #33335a; border-radius: 8px; padding: 10px; }
  .prompt-float .p-sentence { font-size: 0.85rem; }
  .prompt-float .btn.primary { font-size: 1rem; padding: 12px; width: 100%; }
  .prompt-float .p-buttons { flex-direction: column; }
</style></head><body>
<div class="app">
  <div class="top"><b style="color:#adf">scutemob</b><span>Turn 10 · Bot-3's turn · Main 1</span><span style="margin-left:auto" class="btn">log</span><span class="btn">≡</span></div>
  <div class="seats" id="seats"></div>
  <div class="mat"><div class="lanes" id="lanes"></div><div class="mine" id="mine"></div><div class="low" id="low"></div></div>
  <div class="hand" id="hand"></div>
  <div class="right"><div class="stackbox"><div class="panel-title">Stack</div><div id="stack"></div></div><div class="prompt-float" id="prompt"></div></div>
</div>
<script src="common.js"></script>
<script>
  GAME.opps.forEach(o => {
    const s = el('div', 'seat' + (o.active ? ' active' : ''));
    s.append(el('div', '', `<span class="seat-name">${o.name}</span>${o.active ? ' <span class="badge active">active</span>' : ''}`), el('div', 'life' + (o.life < 20 ? ' low' : ''), o.life), el('div', 'counts', `hand ${o.hand} · lib ${o.lib} · gy ${o.gy}`), el('div', 'dim', `★ ${o.commander.split(',')[0]}`));
    document.getElementById('seats').append(s);
    const lane = el('div', 'lane');
    lane.append(el('div', 'who', `<span class="seat-name">${o.name}</span><br><span class="dim">${o.commander.split(',')[0]}</span>`), cardsRow(o.creatures.concat(o.others), 'small'), el('div', 'lands', landPips(o.lands)));
    document.getElementById('lanes').append(lane);
  });
  const me = el('div', 'seat you');
  me.append(el('div', '', `<span class="seat-name">Human-1</span> <span class="badge prio">priority</span>`), el('div', 'life', '40'), el('div', 'counts', 'hand 5 · lib 89 · gy 3'), el('div', 'dim', '★ Nadaar'));
  document.getElementById('seats').append(me);
  document.getElementById('mine').append(cardsRow(GAME.you.creatures, 'perm'));
  const low = document.getElementById('low');
  low.append(cardsRow(GAME.you.others, 'small'), el('div', 'sep'), cardsRow(GAME.you.lands, 'small'));
  GAME.you.hand.forEach((c, i) => { const e = cardEl(c, 'hand'); e.style.setProperty('--i', i); document.getElementById('hand').append(e); });
  document.getElementById('stack').append(stackList());
  document.getElementById('prompt').append(promptEl());
</script></body></html>
